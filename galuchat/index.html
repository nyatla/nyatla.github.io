    <main>
      <div class="intro">
        <h1><ml-text ja="ローカルで動く、軽量な逆ジオコーディングSDK" en="A lightweight reverse geocoding SDK that runs locally"></ml-text></h1>
        <p class="lead"><ml-text ja="Galuchat GIS SDKは、軽量な地理データをアプリや端末に配置し、少ない計算資源で経緯度から地域コードと地名を調べられます。指定範囲の区域も地図画像として読み出せます。" en="With Galuchat GIS SDK, you can keep lightweight geographic data in your app or on your device and look up region codes and place names from coordinates using modest computing resources. You can also render regions in a specified area as a map image."></ml-text></p>
      </div>
      <section id="about">
        <h2><ml-text ja="概要" en="Overview"></ml-text></h2>
        <h3><ml-text ja="何を解決するのか" en="The problem it solves"></ml-text></h3>
        <p><ml-text ja="逆ジオコーディングにおける通信環境と外部GISサービスへの依存をなくします。座標を外部へ送信せずに処理できるため、オフライン環境や閉域ネットワークでも運用できます。" en="Galuchat GIS SDK removes reverse geocoding's dependence on network connectivity and external GIS services. It processes coordinates without sending them outside the device, enabling use in offline and closed-network environments."></ml-text></p>
        <h3 class="about-subsection"><ml-text ja="どのように実現しているのか" en="How it works"></ml-text></h3>
        <p><ml-text ja="区域コードを記録した地図を圧縮して保存します。地点を調べるときは、経緯度に対応するコードを読み出し、地名辞書で地名に変換します。指定した範囲の区域も画像として読み出せるため、地図全体をメモリに展開せずに区域の形を表示できます。" en="The SDK stores a compressed map of region codes. To look up a point, it reads the code at the given coordinates and converts it to a place name using a name dictionary. It can also read regions in a specified area as an image, so you can display their shapes without loading the entire map into memory."></ml-text></p>
        <h3 class="about-subsection"><ml-text ja="精度はどのくらいなのか" en="How accurate is it?"></ml-text></h3>
        <p><ml-text ja="逆ジオコーディングのデータとして使用した場合、ラスタ化による区域判定のずれは境界付近で最大約1画素です。高解像度版では1画素が緯度・経度とも0.0001度で、緯度方向の約11mに相当します。" en="For reverse geocoding, rasterization can cause region-classification differences of up to about one pixel near boundaries. In the high-resolution version, one pixel is 0.0001 degrees in both latitude and longitude, or about 11 m in the latitude direction."></ml-text></p>
      </section>
      <section id="try">
        <h2><ml-text ja="実際に試す" en="Try it for yourself"></ml-text></h2>
        <div class="demo">
          <h3><ml-text ja="座標から地名を調べる" en="Look up a place from coordinates"></ml-text></h3>
          <p><ml-text ja="データを選び、緯度・経度を入力すると、該当する区域と地名を確認できます。WebMCPを通じて、対応するAIからもこのツールを利用できます。" en="Choose a dataset and enter a latitude and longitude to see the matching region and place name. Compatible AI clients can also use this tool through WebMCP."></ml-text></p>
          <p><ml-text ja="入力した座標をブラウザ内で逆ジオコーディングしています。Galuchat GIS SDKのJavaScript版のReverseGeocoderを使っています。" en="The browser reverse-geocodes the coordinates you enter. It uses ReverseGeocoder from the JavaScript version of Galuchat GIS SDK."></ml-text></p>
          <p><a href="./mcp/"><ml-text ja="逆ジオコーディングツールを開く" en="Open the reverse geocoding tool"></ml-text></a></p>
          <p><a href="./webmcp/"><ml-text ja="WebMCPでAIから利用する方法を見る" en="Learn how to use it from AI via WebMCP"></ml-text></a></p>
        </div>
        <div class="demo">
          <h3><ml-text ja="地図で区域を見る" en="Explore regions on a map"></ml-text></h3>
          <p><ml-text ja="地図上の地点を選び、その場所を含む区域と地名を調べられます。表示したい地域を選んでください。" en="Choose a point on a map to inspect the region and place name at that location. Select the area you want to explore."></ml-text></p>
          <p><ml-text ja="選んだデータの区域を地図上に描画しています。Galuchat GIS SDKのJavaScript版の地図表示部品を使っています。" en="The selected dataset's regions are drawn on the map. It uses the map display components from the JavaScript version of Galuchat GIS SDK."></ml-text></p>
          <a href="./maps/"><ml-text ja="地図ページを開く" en="Open the map page"></ml-text></a>
        </div>
        <div class="demo">
          <h3><ml-text ja="組込機器で動かす" en="Run it on embedded devices"></ml-text></h3>
          <p><ml-text ja="Raspberry Pi Pico / Pico 2やESP32系向けのファームウェアを用意しています。対応ボードに書き込み、シリアル端末から経緯度を入力すると、地域コードと地名を確認できます。" en="Firmware is available for Raspberry Pi Pico / Pico 2 and ESP32 boards. Flash a compatible board and enter coordinates in a serial terminal to see the region code and place name."></ml-text></p>
          <p><ml-text ja="入力した座標を機器内のデータで検索しています。Galuchat GIS SDKのC++/Arduino版を使っています。" en="The device looks up the coordinates you enter using data stored on it. It uses the C++/Arduino version of Galuchat GIS SDK."></ml-text></p>
          <a href="./embedded/"><ml-text ja="組込機器向けデモと書き込み手順を見る" en="View embedded demos and flashing instructions"></ml-text></a>
        </div>
        <div class="demo">
          <h3><ml-text ja="SDKを使ってソフトウェアを開発する" en="Build software with the SDK"></ml-text></h3>
          <p><ml-text ja="JavaScript、Java、Python、C++の導入手順とサンプルを用意しています。地域コードと地名の取得を、自分のソフトウェアに組み込めます。" en="Get started with guides and samples for JavaScript, Java, Python, and C++. Add region-code and place-name lookups to your own software."></ml-text></p>
          <p><ml-text ja="各言語のサンプルで地図データを読み込み、座標から地域コードと地名を取得しています。Galuchat GIS SDKのJavaScript・Java・Python・C++版を使っています。" en="The samples in each language load map data and resolve coordinates to region codes and place names. They use the JavaScript, Java, Python, and C++ versions of Galuchat GIS SDK."></ml-text></p>
          <ml-block><span data-lang="ja"><a href="https://github.com/nyatla/galuchat-gis-sdk/blob/master/README.ja.md">SDKの導入手順を見る</a></span><span data-lang="en"><a href="https://github.com/nyatla/galuchat-gis-sdk/blob/master/README.md">View the SDK getting started guide</a></span></ml-block>
        </div>
      </section>

        <p class="section-link"><ml-block><span data-lang="ja">各データの範囲、解像度、ファイルサイズ、出典と利用条件は <a href="https://github.com/nyatla/galuchat-gis-sdk/blob/master/datasets/README.ja.md">データセットガイド</a>で確認できます。</span><span data-lang="en">See the <a href="https://github.com/nyatla/galuchat-gis-sdk/blob/master/datasets/README.md">dataset guide</a> for coverage, resolution, file sizes, sources, and terms.</span></ml-block></p>
