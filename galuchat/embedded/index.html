<!doctype html>
<html lang="ja" data-title-ja="Galuchat — 組込デモ" data-title-en="Galuchat — Embedded demos">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GaluchatのRP2040、RP2350、ESP32、ESP32-S3向け組込デモです。" data-description-ja="GaluchatのRP2040、RP2350、ESP32、ESP32-S3向け組込デモです。" data-description-en="Embedded Galuchat demos for RP2040, RP2350, ESP32, and ESP32-S3 boards.">
    <title>Galuchat — 組込デモ</title>
    <link rel="stylesheet" href="../assets/machml-switch.css">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #20262d; background: #fff; font: 16px/1.75 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      a { color: #175582; text-underline-offset: 3px; }
      a:hover { color: #103e60; }
      a:focus-visible, button:focus-visible { outline: 2px solid #175582; outline-offset: 3px; }
      .page { width: min(100% - 40px, 860px); margin: 0 auto; }
      header { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 28px; padding: 20px 0; border-bottom: 1px solid #d6dce1; }
      .brand { color: inherit; font-weight: 700; text-decoration: none; }
      .header-actions { margin-left: auto; }
      .language-switch { gap: 10px; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; }
      .language-switch button { padding: 2px 0; border-radius: 0; border-bottom: 1px solid transparent; color: #4a535b; background: none; font: inherit; font-size: 13px; font-weight: 400; }
      .language-switch button:hover, .language-switch button.active { color: #20262d; background: none; border-bottom-color: currentColor; }
      main { padding: 58px 0 0; }
      h1, h2, h3 { line-height: 1.35; }
      h1 { max-width: 18em; margin: 0 0 20px; font-size: clamp(32px, 5vw, 44px); letter-spacing: -0.03em; }
      h2 { margin: 0 0 18px; font-size: 25px; }
      h3 { margin: 0 0 8px; font-size: 19px; }
      p { margin: 0 0 16px; }
      .lead { max-width: 45em; margin-bottom: 44px; font-size: 18px; }
      section { padding: 36px 0 40px; border-top: 1px solid #d6dce1; }
      .section-head p { max-width: 48em; }
      .terminal-preview { margin: 0; }
      .terminal-preview img { display: block; width: min(100%, 800px); height: auto; border: 1px solid #d6dce1; }
      .terminal-preview figcaption { max-width: 800px; margin-top: 10px; color: #4a535b; font-size: 14px; }
      .cards, .notes { border-top: 1px solid #e1e5e8; }
      .card, .note { padding: 14px 0; border-bottom: 1px solid #e1e5e8; }
      .tag { display: block; color: #4a535b; font-size: 13px; }
      .card h3 { margin: 4px 0 6px; }
      .card p, .note p, .pending-panel p { margin: 0; }
      .action { display: inline-block; margin-top: 8px; }
      .pending, .pending-panel { color: #4a535b; }
      .pending-panel { padding: 14px 0; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 8px 10px; border-bottom: 1px solid #e1e5e8; text-align: left; vertical-align: top; }
      .size { white-space: nowrap; }
      .legal { display: flex; flex-wrap: wrap; gap: 8px 18px; }
      .error { padding: 12px; border: 1px solid #b36363; }
      footer { padding: 24px 0 48px; border-top: 1px solid #d6dce1; color: #4a535b; font-size: 13px; }
      footer p { margin-bottom: 4px; }
      @media (max-width: 620px) {
        .page { width: min(100% - 32px, 860px); }
        header { gap: 8px 16px; }
        main { padding-top: 42px; }
        section { padding: 30px 0 34px; }
        h1 { font-size: 34px; }
        h2 { font-size: 23px; }
        th, td { padding: 8px; }
      }
    </style>
    <script src="../assets/machml.min.js"></script>
    <script src="../assets/machml-switch.js"></script>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="../">Galuchat GIS SDK</a>
        <div class="header-actions">
          <nav class="language-switch" aria-label="Language / 言語">
            <button type="button" data-machml-locale="ja">日本語</button>
            <button type="button" data-machml-locale="en">English</button>
          </nav>
        </div>
      </header>

      <main>
        <h1><ml-text ja="組込機器で動作する逆ジオコーディング" en="Reverse geocoding for embedded devices"></ml-text></h1>
        <p class="lead"><ml-text ja="RP2040・RP2350・ESP32系で、外部APIやネットワーク接続を使わずに座標から地名を取得します。Arduinoソースコードと、実機へ書き込めるUF2・BINを提供しています。" en="Resolve coordinates to place names on RP2040, RP2350, and ESP32 boards without an external API or network connection. Arduino source code and ready-to-flash UF2 and BIN files are provided."></ml-text></p>

        <section aria-labelledby="operation-title">
          <div class="section-head">
            <h2 id="operation-title"><ml-text ja="実機での動作イメージ" en="Running on a device"></ml-text></h2>
            <p><ml-text ja="シリアル端末から経度・緯度を入力すると、端末内の地図とCodeMapを参照して地域コードと地名を返します。" en="Enter longitude and latitude in a serial terminal to resolve the region code and place name from the map and CodeMap stored on the device."></ml-text></p>
          </div>
          <figure class="terminal-preview">
            <img src="../assets/serial-reverse-geocoding.png" width="1462" height="1076" alt="Tera Termのシリアル端末に、座標、地域コード、東京都千代田区という検索結果、処理時間が表示されている画面" data-alt-ja="Tera Termのシリアル端末に、座標、地域コード、東京都千代田区という検索結果、処理時間が表示されている画面" data-alt-en="Tera Term serial console showing coordinates, a region code, the resolved place Tokyo-to Chiyoda-ku, and processing times">
            <figcaption><ml-text ja="RP2040実機のシリアル出力例。座標 139.752800, 35.685200 を入力し、地域コード672と「東京都／千代田区」を取得しています。" en="Example serial output from an RP2040 device. The coordinates 139.752800, 35.685200 resolve to region code 672 and Tokyo-to / Chiyoda-ku."></ml-text></figcaption>
          </figure>
        </section>

        <section aria-labelledby="wokwi-title">
          <div class="section-head">
            <h2 id="wokwi-title"><ml-text ja="Wokwiで試す" en="Try it in Wokwi"></ml-text></h2>
            <p><ml-text ja="オンラインプロジェクトは準備中です。公開後、このページから直接シミュレーションを開けます。" en="Online projects are being prepared. Once published, you can launch each simulation directly from this page."></ml-text></p>
          </div>
          <div class="cards" id="wokwi-list"><p><ml-text ja="読み込み中…" en="Loading…"></ml-text></p></div>
        </section>

        <section aria-labelledby="arduino-title">
          <div class="section-head">
            <h2 id="arduino-title"><ml-text ja="Arduinoプロジェクト" en="Arduino projects"></ml-text></h2>
            <p><ml-text ja="ReaderとGISデータを含む自己完結スケッチです。Arduino IDEで展開先と同名の.inoを開いてください。" en="Each self-contained sketch includes the readers and GIS data. Extract it, then open the matching .ino file in Arduino IDE."></ml-text></p>
          </div>
          <div class="cards" id="project-list"><p><ml-text ja="読み込み中…" en="Loading…"></ml-text></p></div>
        </section>

        <section aria-labelledby="firmware-title">
          <div class="section-head">
            <h2 id="firmware-title"><ml-text ja="ファームウェア" en="Firmware"></ml-text></h2>
            <p><ml-text ja="RP系はUF2、ESP系はブートローダ・パーティションを含む統合BINです。" en="RP boards use UF2 files. ESP images are complete BIN files containing the bootloader and partition table."></ml-text></p>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th><ml-text ja="ボード" en="Board"></ml-text></th><th><ml-text ja="データ" en="Dataset"></ml-text></th><th><ml-text ja="形式" en="Format"></ml-text></th><th><ml-text ja="サイズ" en="Size"></ml-text></th><th><ml-text ja="ダウンロード" en="Download"></ml-text></th></tr></thead>
              <tbody id="firmware-list"><tr><td colspan="5"><ml-text ja="読み込み中…" en="Loading…"></ml-text></td></tr></tbody>
            </table>
          </div>
        </section>

        <section aria-labelledby="write-title">
          <div class="section-head"><h2 id="write-title"><ml-text ja="書き込み" en="Flashing"></ml-text></h2></div>
          <div class="notes">
            <article class="note">
              <h3>Raspberry Pi Pico / Pico 2</h3>
              <p><ml-text ja="BOOTSELを押したままUSB接続し、表示されたUSBドライブへUF2をコピーします。" en="Hold BOOTSEL while connecting USB, then copy the UF2 file to the mounted USB drive."></ml-text></p>
            </article>
            <article class="note">
              <h3>ESP32 / ESP32-S3</h3>
              <p><ml-text ja="対象容量と一致するボードへ、統合BINをFlashアドレス0x0から書き込みます。N03 1/10000のESP32 8MB版はGISデータも完全BINに収録済みです。" en="Flash the complete BIN at address 0x0 on a board with the matching flash capacity. The ESP32 8MB N03 1/10000 image includes its GIS data."></ml-text></p>
            </article>
          </div>
        </section>

        <section aria-labelledby="build-title">
          <div class="section-head">
            <h2 id="build-title"><ml-text ja="ビルド・ライセンス" en="Build &amp; legal"></ml-text></h2>
            <p id="build-environment"></p>
          </div>
          <p class="legal" id="legal-links"></p>
        </section>
      </main>

      <footer>
        <p><a href="../"><ml-text ja="← Galuchatデモ" en="← Galuchat demos"></ml-text></a></p>
        <p><ml-text ja="GaluchatソフトウェアはApache License 2.0で提供されます。GISデータには個別の出典・利用条件があります。" en="Galuchat software is licensed under the Apache License 2.0. GIS datasets have separate attribution requirements."></ml-text></p>
      </footer>
    </div>

    <script>
      const manifestUrl = "./downloads/manifest.json";

      function sizeLabel(bytes) {
        return `${(bytes / 1048576).toFixed(bytes >= 10485760 ? 1 : 2)} MiB`;
      }

      function downloadUrl(path) {
        return `./downloads/${path}`;
      }

      function datasetLabels(item) {
        const labels = {
          n03_1000: ["N03 2026 / 1/1000度", "N03 2026 / 1/1000 degree"],
          n03_10000: ["N03 2026 / 1/10000度", "N03 2026 / 1/10000 degree"],
          geoboundaries_100: ["geoBoundaries CGAZ / 1/100度", "geoBoundaries CGAZ / 1/100 degree"],
        };
        return labels[item.dataset] || [item.datasetLabel, item.datasetLabel];
      }

      function renderWokwi(items) {
        const container = document.querySelector("#wokwi-list");
        if (items.every((item) => !item.url)) {
          const panel = document.createElement("article");
          panel.className = "pending-panel";
          const title = document.createElement("strong");
          title.append(GaluchatLocale.text("Wokwiプロジェクトは準備中です", "Wokwi projects are coming soon"));
          const detail = document.createElement("p");
          detail.append(GaluchatLocale.text("RP2040・ESP32・ESP32-S3向けを、公開後にここから起動できます。", "RP2040, ESP32, and ESP32-S3 simulations will launch from here once published."));
          panel.append(title, detail);
          container.replaceChildren(panel);
          return;
        }
        container.replaceChildren(...items.map((item) => {
          const card = document.createElement("article");
          card.className = "card";
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = item.target;
          const title = document.createElement("h3");
          title.append(GaluchatLocale.text(...datasetLabels(item)));
          const board = document.createElement("p");
          board.textContent = item.targetLabel;
          const action = document.createElement(item.url ? "a" : "span");
          action.className = `action${item.url ? "" : " pending"}`;
          action.append(item.url
            ? GaluchatLocale.text("Wokwiを開く →", "Open in Wokwi →")
            : GaluchatLocale.text("準備中", "Coming soon"));
          if (item.url) {
            action.href = item.url;
            action.target = "_blank";
            action.rel = "noopener noreferrer";
          }
          card.append(tag, title, board, action);
          return card;
        }));
      }

      function renderProjects(items) {
        const container = document.querySelector("#project-list");
        container.replaceChildren(...items.map((item) => {
          const card = document.createElement("article");
          card.className = "card";
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = item.target;
          const title = document.createElement("h3");
          title.append(GaluchatLocale.text(...datasetLabels(item)));
          const board = document.createElement("p");
          board.textContent = `${item.targetLabel} · ${sizeLabel(item.size)}`;
          const action = document.createElement("a");
          action.className = "action";
          action.href = downloadUrl(item.url);
          action.download = "";
          action.append(GaluchatLocale.text("Arduino ZIPをダウンロード ↓", "Download Arduino ZIP ↓"));
          card.append(tag, title, board, action);
          return card;
        }));
      }

      function renderFirmware(items) {
        const body = document.querySelector("#firmware-list");
        body.replaceChildren(...items.map((item) => {
          const row = document.createElement("tr");
          const board = document.createElement("td");
          board.textContent = item.targetLabel;
          const dataset = document.createElement("td");
          dataset.append(GaluchatLocale.text(...datasetLabels(item)));
          const format = document.createElement("td");
          format.textContent = item.format;
          const size = document.createElement("td");
          size.className = "size";
          size.textContent = sizeLabel(item.size);
          const linkCell = document.createElement("td");
          const link = document.createElement("a");
          link.href = downloadUrl(item.url);
          link.download = "";
          link.append(GaluchatLocale.text("ダウンロード ↓", "Download ↓"));
          linkCell.append(link);
          row.append(board, dataset, format, size, linkCell);
          return row;
        }));
      }

      function renderLegal(manifest) {
        const env = manifest.buildEnvironment;
        const galuchatCore = manifest.galuchatCore;
        const galuchatVersion = galuchatCore
          ? `Galuchat Core ${galuchatCore.version} · ${galuchatCore.commit.slice(0, 7)}`
          : "Galuchat Core · version unavailable";
        document.querySelector("#build-environment").textContent =
          `${galuchatVersion} · Arduino CLI ${env.arduinoCli} · ESP32 Core ${env.esp32Core} · Arduino-Pico Core ${env.rp2040Core}`;
        const labels = [
          ["Apache License 2.0", "Apache License 2.0", manifest.legal.license],
          ["NOTICE", "NOTICE", manifest.legal.notice],
          ["N03の出典", "N03 attribution", manifest.legal.n03Notice],
          ["geoBoundariesの出典", "geoBoundaries attribution", manifest.legal.geoboundariesNotice],
          ["SHA-256", "SHA-256", manifest.legal.checksums],
        ];
        const container = document.querySelector("#legal-links");
        container.replaceChildren(...labels.map(([ja, en, path]) => {
          const link = document.createElement("a");
          link.href = downloadUrl(path);
          link.append(GaluchatLocale.text(ja, en));
          return link;
        }));
      }

      fetch(manifestUrl)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((manifest) => {
          renderWokwi(manifest.wokwi);
          renderProjects(manifest.arduinoProjects);
          renderFirmware(manifest.firmware);
          renderLegal(manifest);
        })
        .catch((error) => {
          const message = document.createElement("p");
          message.className = "error";
          message.append(GaluchatLocale.text(
            `公開マニフェストを読み込めませんでした: ${error.message}`,
            `Could not load the publication manifest: ${error.message}`,
          ));
          document.querySelector("main").prepend(message);
        });
    </script>
  </body>
</html>
